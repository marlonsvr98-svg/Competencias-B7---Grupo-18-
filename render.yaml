services:
  - type: web
    name: ecosistema-educativo
    runtime: node
    plan: free
    buildCommand: npm install && node servidor/semilla.js
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: IA_PROVEEDOR
        value: gemini
      - key: IA_MODELO
        value: gemini-1.5-flash
      - key: IA_CLAVE
        sync: false
